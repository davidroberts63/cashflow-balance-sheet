name: Deploy to GitHub Pages

on:
  push:
    branches:
      - CashAvailable # Triggers the script on push to main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 24 # You can change this to your preferred Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Safer and faster than 'npm install' in CI environments

      - name: Build project
        run: npm run build # Creates your 'dist' folder

      - name: Upload production artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Points to your build output folder

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5